# AI Office worker. Copy to .github/workflows/ai-worker.yml in each project repo (default branch).
# The hub starts it with workflow_dispatch; it is never triggered by issue text directly.
#
# Repo (or org) secrets needed:
#   CLAUDE_CODE_OAUTH_TOKEN  – Claude Pro/Max subscription token from `claude setup-token`
#   AI_OFFICE_WORKER_SECRET  – same value as WORKER_SECRET on the hub
name: AI Office worker
run-name: ai-office job ${{ inputs.job_id }} (${{ inputs.stage }} #${{ inputs.issue_number }})

on:
  workflow_dispatch:
    inputs:
      job_id: { required: true, type: string }
      stage: { required: true, type: string }
      issue_number: { required: true, type: string }
      prompt: { required: true, type: string }
      claude_args: { required: true, type: string }
      hub_url: { required: true, type: string }

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read

concurrency:
  group: ai-office-issue-${{ inputs.issue_number }}
  cancel-in-progress: false

jobs:
  work:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude worker
        id: claude
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          # Uses your Claude subscription. To pay per use instead, replace with:
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          # The hub starts this run as its GitHub App, which the action treats as a bot.
          # Allow only that App (its slug). Never use '*' here.
          allowed_bots: sherwynd-ai-office
          show_full_output: true  # TEMP: diagnosing, remove after
          prompt: ${{ inputs.prompt }}
          claude_args: ${{ inputs.claude_args }}

      - name: Report to AI Office
        if: always()
        env:
          SECRET: ${{ secrets.AI_OFFICE_WORKER_SECRET }}
          HUB_URL: ${{ inputs.hub_url }}
          JOB_ID: ${{ inputs.job_id }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          BRANCH_NAME: ${{ steps.claude.outputs.branch_name }}
        run: |
          [ -n "$SECRET" ] || { echo "AI_OFFICE_WORKER_SECRET not set; skipping report"; exit 0; }
          COST=null
          if [ -f "$EXECUTION_FILE" ]; then
            COST=$(jq '[.[] | select(.type == "result")] | last | .total_cost_usd // null' "$EXECUTION_FILE")
          fi
          BODY=$(jq -cn --arg job "$JOB_ID" --arg branch "$BRANCH_NAME" --argjson cost "$COST" \
            '{job_id: $job, cost_usd: $cost, branch_name: (if $branch == "" then null else $branch end)}')
          SIG="sha256=$(printf '%s' "$BODY" | openssl dgst -sha256 -hmac "$SECRET" -hex | sed 's/^.* //')"
          curl -fsS -X POST "$HUB_URL/api/jobs/$JOB_ID/report" \
            -H "content-type: application/json" -H "x-hub-signature-256: $SIG" --data "$BODY"
